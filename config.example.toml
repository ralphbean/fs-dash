version = 1
repositories = ["fullsend-ai/fullsend"]
log_limit = 500
theme = "dark" # dark or light
color = "auto" # auto or never; NO_COLOR is always honored

[bindings.o]
summary = "Open selected PR"
executable = "xdg-open"
args = ["{url}"]
detach = true

# Example: launch your own terminal command. Placeholders are substituted in
# individual arguments without a shell. Set a real working directory.
